
name: Build Windows

on:
  push:
    branches: [master, organizacion]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_mingw
          tools: 'tools_mingw1310'

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt dependencies
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter *.exe |
            Where-Object { $_.FullName -notmatch 'CMakeFiles|_deps' } |
            Select-Object -First 1

          if (-not $exe) {
            throw "No se encontró ningún ejecutable .exe"
          }

          windeployqt --release --compiler-runtime "$($exe.FullName)"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: BancoDonante-Windows
          path: build/
          if-no-files-found: error

